<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rental Renewal Reminders — 27 Jul 2026</title>
<style>
  :root {
    --bg: #0f1115;
    --card-bg: #171a21;
    --accent: #25d366;
    --accent-dim: #1da851;
    --text: #e8eaed;
    --text-dim: #9aa0a6;
    --border: #2a2e37;
    --urgent: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 60px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .header {
    max-width: 640px;
    margin: 0 auto 24px;
  }
  .header h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
  }
  .header p {
    color: var(--text-dim);
    margin: 0;
    font-size: 0.9rem;
  }
  .container {
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 10px;
  }
  .owner-name {
    font-size: 1.1rem;
    font-weight: 600;
    margin: 0;
  }
  .flat-address {
    color: var(--text-dim);
    font-size: 0.88rem;
    margin: 2px 0 0;
  }
  .badge {
    font-size: 0.72rem;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge.due-today {
    background: rgba(255,107,107,0.15);
    color: var(--urgent);
  }
  .badge.due-30 {
    background: rgba(37,211,102,0.15);
    color: var(--accent);
  }
  .meta-row {
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-bottom: 14px;
  }
  .send-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--accent);
    color: #06210f;
    font-weight: 600;
    font-size: 0.95rem;
    text-decoration: none;
    padding: 12px;
    border-radius: 10px;
    transition: background 0.15s ease;
  }
  .send-btn:active {
    background: var(--accent-dim);
  }
  .empty-state {
    max-width: 640px;
    margin: 60px auto;
    text-align: center;
    color: var(--text-dim);
  }
  .empty-state .big {
    font-size: 2.5rem;
    margin-bottom: 10px;
  }
  .footer-note {
    max-width: 640px;
    margin: 30px auto 0;
    text-align: center;
    color: var(--text-dim);
    font-size: 0.78rem;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="header">
    <h1>Rental Renewal Reminders</h1>
    <p>Generated 27 Jul 2026 · 0 due today</p>
  </div>
  <div class="container">
    
  </div>
  <div class="empty-state"><div class="big">✅</div><p>No reminders due today. Nothing to send.</p></div>
  <div class="footer-note">
    Tap "Send WhatsApp" to open a pre-filled message in your own WhatsApp account.
    Nothing is sent automatically — you review and tap Send yourself.
  </div>
</body>
</html>
