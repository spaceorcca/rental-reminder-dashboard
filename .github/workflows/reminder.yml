name: Generate Rental Reminder Dashboard

on:
  schedule:
    # Runs daily at 07:00 IST (01:30 UTC), well before the "morning check" habit.
    - cron: "30 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate dashboard
        id: generate
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python generate_dashboard.py

      - name: Commit and push updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --quiet --cached || git commit -m "Update reminder dashboard $(date +'%Y-%m-%d')"
          git push

      # Only runs if any previous step in this job failed.
      # Sends a plain email via a free Gmail account + app password, so a
      # broken pipeline never fails silently.
      - name: Email me if this run failed
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.ALERT_GMAIL_ADDRESS }}
          password: ${{ secrets.ALERT_GMAIL_APP_PASSWORD }}
          subject: "⚠️ Rental Reminder Dashboard failed to build"
          to: ${{ secrets.ALERT_GMAIL_ADDRESS }}
          from: Rental Reminder Bot
          body: |
            The daily rental reminder dashboard workflow failed on ${{ github.repository }}.

            Run details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Nothing was sent to owners today until this is fixed — check the
            Actions log above for the exact error (common causes: sheet name/ID
            changed, sheet no longer shared with the service account, or a
            secret was edited incorrectly).
